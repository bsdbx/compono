name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The ruleset on main requires this job by name, so don't rename it
 checks:
    runs-on: ubuntu-latest
    # PostgreSQL for the backend's tests, set up as compose.yaml sets it up locally
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: compono
          POSTGRES_PASSWORD: compono
          POSTGRES_DB: compono
        # The same port as compose.yaml, so the backend's default DATABASE_URL works here too
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready --username=compono --dbname=compono"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      # The whole history, to read every commit of the pull request
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same uv version as install.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"

      - name: Install Python and backend dependencies
        run: uv --directory backend sync --locked

      # The pnpm version that frontend/package.json pins, as install.sh installs
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Install Node.js and frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # Also runs the migrations, and checks that they match the models
      - name: Run the backend's tests
        run: uv --directory backend run --frozen pytest

      # Hooks only run on each developer's machine and can be skipped, so run them again here
      - name: Run the pre-commit checks
        run: .githooks/pre-commit

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::Commit $commit has a bad message. Fix it with git rebase -i."
              failed=1
            fi
          done
          exit $failed
