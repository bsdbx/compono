[project]
name = "compono"
version = "0.1.0"
description = "Backend for Compono"

requires-python = ">=3.14"
# Authors are unnecessary for non-public project.
# If there will be a sufficient amount of contributors, then considering automatic population.
authors = []
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
# Register the `compono` command in .venv. This allows `uv run compono`
compono = "compono:main"

# Dev-only tools. Must never be in the app directly
[dependency-groups]
dev = [
    "commit-check>=2.19.2",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "rumdl>=0.3.0",
    "shfmt-py>=4.2.0",
    "tombi>=1.8.9",
    "typos>=1.51.1",
]

# Build system uses uv_build
[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

# Migrations.
[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# Fix and format every new migration, so that it passes the pre-commit hook
[[tool.alembic.post_write_hooks]]
name = "ruff-check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.mypy]
# Absolute paths (mypy fills in this folder), so mypy's cache can tell the pre-commit hook's temporary copies apart and never reuses stale results.
# tools/ holds the scripts for working on the project, like ./tasks.sh. They run on the backend's Python, so they're checked the same way.
files = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/migrations", "$MYPY_CONFIG_FILE_DIR/../tools"]
strict = true  # `strict` must always be set to `true`, to enforce "strict" type checking.

# Plugins
plugins = ["pydantic.mypy"]  # Understands pydantic models, such as the settings

# Everything below covers what `strict` doesn't by default.
warn_unreachable = true  # Code that can never run
strict_equality_for_none = true  # Comparing to `None` when the value can't be `None`
disallow_any_unimported = true  # Types that became `Any` because an import could not be found
disallow_any_explicit = true  # Writing `Any` yourself. Some libraries force it, so consider disabling in certain places
disallow_any_decorated = true  # A function that becomes `Any` because of the decorator
disallow_any_expr = true  # Any value of type `Any` at all

# Extra error codes
enable_error_code = [
    "deprecated",  # Using things marked deprecated
    "exhaustive-match",  # A `match` must cover every case
    "explicit-override",  # Overriding a method needs `@override`
    "ignore-without-code",  # A `# type: ignore` must name the error.
    "mutable-override",  # An unsafe change to an attribute's type in a subclass
    "possibly-undefined",  # A variable that might not be set
    "redundant-expr",  # A condition that is always True or always False
    "redundant-self",  # An unnecessary `Self` annotation
    "truthy-bool",  # An `if` on something that is always True
    "truthy-iterable",  # `reveal_type` must be imported
    "unimported-reveal",  # A forgotten `await`
    "unused-awaitable",
]

# Typed __init__ for pydantic models, so a wrong or unknown field is a type error
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Present (even though empty) so ruff uses its defaults, not a personal config.
[tool.ruff]
