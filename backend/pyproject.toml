[project]
name = "compono"
version = "0.1.0"
description = "Backend for Compono"

requires-python = ">=3.14"
authors = []
dependencies = []

[project.scripts]
compono = "compono:main"

[dependency-groups]
dev = [
    "commit-check>=2.19.2",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "rumdl>=0.3.0",
    "shfmt-py>=4.2.0",
    "tombi>=1.8.9",
    "typos>=1.51.1",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
# An absolute path (mypy fills in this folder), so mypy's cache can tell the
# pre-commit hook's temporary copies apart and never reuses stale results.
files = ["$MYPY_CONFIG_FILE_DIR/src"]
strict = true  # `strict` must always be set to `true`, to enforce "strict" type checking.

# Everything below covers what `strict` doesn't by default.
warn_unreachable = true
strict_equality_for_none = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

# Present (even though empty) so ruff uses its defaults, not a personal config.
[tool.ruff]
