name: compono

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: compono
      POSTGRES_PASSWORD: compono
      POSTGRES_DB: compono
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "db:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "--username=compono", "--dbname=compono"]
      interval: 2s
      timeout: 5s
      retries: 15
  # Document the database into docs/database after each migration: docker compose run --rm tbls
  tbls:
    image: ghcr.io/k1low/tbls:v1.96.1
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ".:/work"
    working_dir: /work
    user: "${UID:-1000}:${GID:-1000}"
    command: doc --rm-dist

volumes:
  db:
